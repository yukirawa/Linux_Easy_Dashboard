[package]
name = "easy-dashboard-maker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native GTK4 + libadwaita desktop dashboard for Arch Linux"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
glib = "0.22.9"
libadwaita = { version = "0.9.2", features = ["v1_5"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0"
log = "0.4.28"
env_logger = "0.11"
rustix = { version = "1.1.5", features = ["fs"] }
minreq = { version = "3.0.0", default-features = false, features = ["https-openssl", "json-using-serde", "openssl-probe"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
